services:
  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: killeraste-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://killeraste.onrender.com
      - key: VITE_SKIP_AUTH
        value: "false"
      # Set manually in Render dashboard:
      # VITE_GOOGLE_CLIENT_ID

  # ── Backend (Python/FastAPI) ───────────────────────────────────────────────
  - type: web
    name: killeraste
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: INGESTION_MODE
        value: safe
      - key: DRY_RUN
        value: "false"
      - key: REDIS_ENABLED
        value: "false"
      - key: ENABLE_METRICS
        value: "false"
      - key: API_WORKERS
        value: "1"
      - key: CONFIG_PATH
        value: config/config.yaml
      # Set these manually in the Render dashboard (never commit secrets):
      # SECRET_KEY
      # DATABASE_URL      (asyncpg URL with ?ssl=require)
      # DATABASE_SYNC_URL (psycopg2 URL with ?sslmode=require)
      # GOOGLE_CLIENT_ID
      # FRONTEND_URL      (https://killeraste-frontend.onrender.com)
