version: "3.9"

# ── Development override ──────────────────────────────────────────────────────
# Mounts source code, enables hot-reload, forces dry_run mode.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up

services:
  app:
    volumes:
      - ..:/app
    environment:
      INGESTION_MODE: dry_run
      DRY_RUN: "true"
      LOG_LEVEL: DEBUG
      APP_ENV: development
    command: >
      uvicorn app.api.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/app
